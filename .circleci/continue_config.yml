version: 2.1

orbs:
  go: circleci/go@3.0.4

parameters:
  run_backend_build_and_test:
    type: boolean
    default: false

jobs:
  backend_build_and_test:
    executor:
      name: go/default
      tag: '1.24'
    working_directory: ~/circle-app/backend
    steps:
      - checkout:
          path: ~/circle-app
      - go/mod-download
      - run:
          name: Install gotestsum
          command: go install gotest.tools/gotestsum@latest
      - run:
          name: Run tests
          command: |
            mkdir -p /tmp/test-results
            gotestsum --junitfile /tmp/test-results/report.xml ./...
      - store_test_results:
          path: /tmp/test-results

workflows:
  backend:
    # DEBUG
    # when: << pipeline.parameters.run_backend_build_and_test >>
    when: true
    jobs:
      - backend_build_and_test
