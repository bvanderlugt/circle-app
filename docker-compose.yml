services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: circle
      POSTGRES_PASSWORD: circle
      POSTGRES_DB: circle
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U circle -d circle"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://circle:circle@db:5432/circle?sslmode=disable
    ports:
      - "8080:8080"

volumes:
  db-data:
